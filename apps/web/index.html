<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDungen</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      // Dark is the default: only an explicit "light" (or a
      // system preference for light when stored is "system")
      // leaves the .dark class off.
      (function () {
        try {
          var stored = localStorage.getItem("opendungen.theme") || "dark";
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          // Storage unavailable: keep the dark default.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
